<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fath Al-Rahman | فتح الرحمن في تعليم كلمات القرآن</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #2e7d32;
      --accent: #c2185b;
      --bg: #f4fbf7;
      --card-bg: #ffffff;
      --text: #1a237e;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, 'Amiri', 'Traditional Arabic', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 8px 6px;
      background: var(--bg);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header { text-align: center; margin-bottom: 6px; }
    h1 { margin: 2px 0; color: var(--primary); font-size: 1.35rem; }
    .subtitle { color: #555; font-size: 0.82rem; }

    /* Top Navigation Tabs */
    .mode-nav {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 8px;
      width: 100%;
      max-width: 700px;
    }
    .mode-btn {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 8px;
      border: 1px solid #81c784;
      background: white;
      color: var(--primary);
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Lesson selector bar */
    .lesson-bar {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
      width: 100%;
      max-width: 680px;
    }
    select {
      padding: 7px 10px;
      font-size: 0.88rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      cursor: pointer;
      font-weight: bold;
      color: var(--primary);
      max-width: 80vw;
    }
    .reset-btn {
      padding: 7px 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Game Card Box */
    .game-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
      padding: 14px 10px;
      width: 100%;
      max-width: 640px;
      text-align: center;
      border: 2px solid #e0f2f1;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      color: #555;
      font-weight: bold;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .activity-title {
      font-size: 1.05rem;
      color: #00796b;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .instruction-text {
      font-size: 0.88rem;
      color: #666;
      margin-bottom: 8px;
    }

    /* Target Word and Texts */
    .target-word {
      font-size: 3.1rem;
      color: var(--text);
      letter-spacing: 2px;
      margin: 4px 0;
      min-height: 65px;
      font-weight: bold;
      font-family: 'Amiri', 'Traditional Arabic', serif;
    }
    .transliteration {
      font-size: 1.15rem;
      color: var(--accent);
      font-weight: bold;
      margin-bottom: 4px;
    }
    .spelling-guide {
      font-size: 0.88rem;
      color: #e65100;
      background: #fff3e0;
      padding: 5px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 12px;
      border: 1px dashed #ffb74d;
    }

    /* Assembly Zone (Right to Left) */
    .assembly-zone {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
      min-height: 55px;
      direction: rtl;
    }
    .slot {
      width: 54px;
      height: 54px;
      border: 2px dashed #b0bec5;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      background: #fafafa;
      color: var(--primary);
      font-family: 'Amiri', serif;
      transition: all 0.2s ease;
    }
    .slot.filled {
      border: 2px solid var(--primary);
      background: #e8f5e9;
      transform: scale(1.05);
      font-weight: bold;
    }

    /* Syllables pool */
    .syllables-pool {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
      direction: rtl;
    }
    .syllable-btn {
      background: white;
      border: 2px solid #80cbc4;
      color: #004d40;
      font-size: 1.75rem;
      min-width: 56px;
      height: 56px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.06);
      cursor: pointer;
      user-select: none;
      font-family: 'Amiri', serif;
      transition: transform 0.15s;
    }
    .syllable-btn:active { transform: scale(0.92); }
    .syllable-btn.disabled { opacity: 0.22; pointer-events: none; }

    /* Multiple choice grid */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
      direction: rtl;
    }
    .opt-btn {
      background: white;
      border: 2px solid #b2dfdb;
      border-radius: 12px;
      padding: 12px 6px;
      font-size: 1.45rem;
      color: #004d40;
      cursor: pointer;
      user-select: none;
      font-family: 'Amiri', serif;
      transition: all 0.15s;
    }
    .opt-btn:active { transform: scale(0.96); }
    .opt-btn.correct { background: #c8e6c9 !important; border-color: #388e3c !important; color: #1b5e20 !important; font-weight: bold; }
    .opt-btn.wrong { background: #ffcdd2 !important; border-color: #d32f2f !important; color: #b71c1c !important; }

    /* Flashcard styles */
    .flashcard {
      border: 2px solid #80cbc4;
      border-radius: 14px;
      padding: 18px;
      background: #fafafa;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .reveal-text {
      font-size: 1.1rem;
      color: #e65100;
      margin-top: 10px;
      display: none;
      font-weight: bold;
    }

    /* Actions bottom bar */
    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .action-btn {
      background: #0288d1;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: bold;
    }
    .next-btn { background: #2e7d32; display: none; }
  </style>
</head>
<body>

  <header>
    <h1>📖 Fath Al-Rahman | فتح الرحمن في تعليم كلمات القرآن</h1>
    <div class="subtitle">Complete Word Database from All Book Lessons & Multi-Activities</div>
  </header>

  <!-- 6 Game Mode Tabs -->
  <div class="mode-nav">
    <button class="mode-btn active" onclick="switchMode('spelling')">1. Word Assembly 🧩</button>
    <button class="mode-btn" onclick="switchMode('listen_pick')">2. Listen & Pick 👂</button>
    <button class="mode-btn" onclick="switchMode('tajweed_detect')">3. Tajweed Detective 🔍</button>
    <button class="mode-btn" onclick="switchMode('vowel_speed')">4. Vowel Speed ⚡</button>
    <button class="mode-btn" onclick="switchMode('odd_one_out')">5. Odd One Out 🎯</button>
    <button class="mode-btn" onclick="switchMode('flashcards')">6. Flashcards 🃏</button>
  </div>

  <!-- Lesson selector -->
  <div class="lesson-bar" id="lessonBar">
    <select id="lessonSelect" onchange="changeSpellingLesson()">
      <optgroup label="── 1. Short Vowels (الحركات القصيرة) ──">
        <option value="fatha">Fatḥah Short Vowel (حركة الفتح)</option>
        <option value="kasra">Kasrah Short Vowel (حركة الكسر)</option>
        <option value="damma">Dammah Short Vowel (حركة الضم)</option>
      </optgroup>
      <optgroup label="── 2. Madd Lessons (المدود) ──">
        <option value="madd_alif">Madd with Alif (المد بالألف)</option>
        <option value="madd_yaa">Madd with Yaa (المد بالياء)</option>
        <option value="madd_waw">Madd with Waw (المد بالواو)</option>
        <option value="madd_badal">Madd Badal (مد البدل)</option>
        <option value="madd_muttasil">Madd Muttasil (المد المتصل)</option>
        <option value="madd_munfasil">Madd Munfasil (المد المنفصل)</option>
      </optgroup>
      <optgroup label="── 3. Tanween Lessons (التنوين) ──">
        <option value="tanween_fath">Tanween with Fatḥah (تنوين بالفتح)</option>
        <option value="tanween_kasr">Tanween with Kasrah (تنوين بالكسر)</option>
        <option value="tanween_damm">Tanween with Dammah (تنوين بالضم)</option>
      </optgroup>
      <optgroup label="── 4. Sukoon (السكون والقلقلة) ──">
        <option value="sukoon">Sukoon & Qalqalah (السكون والقلقلة)</option>
        <option value="lam_qamariyyah">Al-Laam Al-Qamariyyah (اللام القمرية)</option>
      </optgroup>
      <optgroup label="── 5. Shaddah Lessons (التشديد) ──">
        <option value="shaddah_fath">Shaddah with Fatḥah (الشدة مع الفتح)</option>
        <option value="shaddah_kasr">Shaddah with Kasrah (الشدة مع الكسر)</option>
        <option value="shaddah_damm">Shaddah with Dammah (الشدة مع الضم)</option>
        <option value="shaddah_tanween">Shaddah with Tanween (التشديد مع التنوين)</option>
        <option value="shaddah_waqf">Shaddah at Waqf (المشدد الموقوف عليه)</option>
      </optgroup>
    </select>
    <button class="reset-btn" onclick="resetSpellingScore()">Reset 🔄</button>
  </div>

  <div class="game-card">
    <div class="top-bar">
      <span>⭐ Score: <span id="score">0</span></span>
      <span>Progress: <span id="qIdx">1</span> / <span id="totalQ">--</span></span>
    </div>

    <div>
      <div class="activity-title" id="actTitle">Activity Title</div>
      <div class="instruction-text" id="actInstr">Instructions appear here</div>

      <div id="contentArea"></div>
    </div>

    <div class="actions">
      <button class="action-btn" id="audioBtn" onclick="playCurrentAudio()">🔊 Listen</button>
      <button class="action-btn next-btn" id="nextBtn" onclick="handleNextClick()">Next ➡️</button>
    </div>
  </div>

  <script>
    let activeMode = 'spelling';
    let currentLesson = 'fatha';
    let currentIdx = 0;
    let score = 0;
    let currentInput = [];
    let currentAudioTarget = '';

    // ==========================================
    // 1. SPELLING DATA BANK (Comprehensive Book Words)
    // ==========================================
    const spellingData = {
      fatha: [
        { word: "أَحَدَ", parts: ["أَ", "حَـ", "دَ"], translit: "a-ḥa-da", rule: "أَ - حَـ - أَحَـ - دَ - أَحَدَ" },
        { word: "أَخَذَ", parts: ["أَ", "خَـ", "ذَ"], translit: "a-kha-dha", rule: "Heavy letter (خَ) only" },
        { word: "ذَرَأَ", parts: ["ذَ", "رَ", "أَ"], translit: "dha-ra-a", rule: "Heavy (رَ) due to Fatḥah" },
        { word: "بَرَزَ", parts: ["بَـ", "رَ", "زَ"], translit: "ba-ra-za", rule: "بَ - رَ - بَرَ - زَ - بَرَزَ" },
        { word: "حَذَرَ", parts: ["حَـ", "ذَ", "رَ"], translit: "ḥa-dha-ra", rule: "حَـ - ذَ - حَذَ - رَ - حَذَرَ" },
        { word: "سَجَدَ", parts: ["سَـ", "جَـ", "دَ"], translit: "sa-ja-da", rule: "سَـ - جَـ - سَجَـ - دَ - سَجَدَ" },
        { word: "شَجَرَ", parts: ["شَـ", "جَـ", "رَ"], translit: "sha-ja-ra", rule: "Heavy (رَ) at the end" },
        { word: "حَسَدَ", parts: ["حَـ", "سَـ", "دَ"], translit: "ḥa-sa-da", rule: "Light letters" },
        { word: "ضَرَبَ", parts: ["ضَـ", "رَ", "بَ"], translit: "ḍa-ra-ba", rule: "Heavy (ضَ) & (رَ), Light (بَ)" },
        { word: "صَبَرَ", parts: ["صَـ", "بَـ", "رَ"], translit: "ṣa-ba-ra", rule: "Heavy (صَ) & (رَ), Light (بَ)" },
        { word: "بَسَطَ", parts: ["بَـ", "سَـ", "طَ"], translit: "ba-sa-ṭa", rule: "Heavy (طَ) only" },
        { word: "عَبَدَ", parts: ["عَـ", "بَـ", "دَ"], translit: "‘a-ba-da", rule: "عَـ - بَـ - عَبَـ - دَ - عَبَدَ" },
        { word: "بَعَثَ", parts: ["بَـ", "عَـ", "ثَ"], translit: "ba-‘a-tha", rule: "Pronounce interdental (ثَ)" },
        { word: "عَشَرَ", parts: ["عَـ", "شَـ", "رَ"], translit: "‘a-sha-ra", rule: "Heavy (رَ) only" },
        { word: "أَفَلَ", parts: ["أَ", "فَـ", "لَ"], translit: "a-fa-la", rule: "أَ - فَـ - أَفَـ - لَ - أَفَلَ" },
        { word: "أَبَقَ", parts: ["أَ", "بَـ", "قَ"], translit: "a-ba-qa", rule: "Heavy (قَ)" },
        { word: "شَكَرَ", parts: ["شَـ", "كَـ", "رَ"], translit: "sha-ka-ra", rule: "شَـ - كَـ - شَكَـ - رَ - شَكَرَ" },
        { word: "أَكَلَ", parts: ["أَ", "كَـ", "لَ"], translit: "a-ka-la", rule: "Light letters" },
        { word: "حَكَمَ", parts: ["حَـ", "كَـ", "مَ"], translit: "ḥa-ka-ma", rule: "حَـ - كَـ - حَكَـ - مَ - حَكَمَ" },
        { word: "نَبَأَ", parts: ["نَـ", "بَـ", "أَ"], translit: "na-ba-a", rule: "نَـ - بَـ - نَبَـ - أَ - نَبَأَ" },
        { word: "جَهَرَ", parts: ["جَـ", "هَـ", "رَ"], translit: "ja-ha-ra", rule: "Clear (جَ), light (هَـ), heavy (رَ)" },
        { word: "يَدَكَ", parts: ["يَـ", "دَ", "كَ"], translit: "ya-da-ka", rule: "يَـ - دَ - يَدَ - كَ - يَدَكَ" },
        { word: "وَجَدَ", parts: ["وَ", "جَـ", "دَ"], translit: "wa-ja-da", rule: "وَ - جَـ - وَجَـ - دَ - وَجَدَ" },
        { word: "وَعَدَ", parts: ["وَ", "عَـ", "دَ"], translit: "wa-‘a-da", rule: "وَ - عَـ - وَعَـ - دَ - وَعَدَ" },
        { word: "عَدَدَ", parts: ["عَـ", "دَ", "دَ"], translit: "‘a-da-da", rule: "عَـ - دَ - عَدَ - دَ - عَدَدَ" },
        { word: "كَتَبَ", parts: ["كَـ", "تَـ", "بَ"], translit: "ka-ta-ba", rule: "كَـ - تَـ - كَتَـ - بَ - كَتَبَ" },
        { word: "كَسَبَ", parts: ["كَـ", "سَـ", "بَ"], translit: "ka-sa-ba", rule: "كَـ - سَـ - كَسَـ - بَ - كَسَبَ" },
        { word: "ذَهَبَ", parts: ["ذَ", "هَـ", "بَ"], translit: "dha-ha-ba", rule: "Interdental (ذَ)" },
        { word: "كَذَبَ", parts: ["كَـ", "ذَ", "بَ"], translit: "ka-dha-ba", rule: "Interdental (ذَ)" },
        { word: "نَزَلَ", parts: ["نَـ", "زَ", "لَ"], translit: "na-za-la", rule: "نَـ - زَ - نَزَ - لَ - نَزَلَ" },
        { word: "سَأَلَ", parts: ["سَـ", "أَ", "لَ"], translit: "sa-a-la", rule: "سَـ - أَ - سَأَ - لَ - سَأَلَ" },

        { word: "عَمَلَ", parts: ["عَـ", "مَـ", "لَ"], translit: "‘a-ma-la", rule: "عَـ - مَـ - عَمَـ - لَ - عَمَلَ" },
        { word: "كَتَمَ", parts: ["كَـ", "تَـ", "مَ"], translit: "ka-ta-ma", rule: "كَـ - تَـ - كَتَـ - مَ - كَتَمَ" },
        { word: "عَزَمَ", parts: ["عَـ", "زَ", "مَ"], translit: "‘a-za-ma", rule: "عَـ - زَ - عَزَ - مَ - عَزَمَ" },
        { word: "زَعَمَ", parts: ["زَ", "عَـ", "مَ"], translit: "za-‘a-ma", rule: "زَ - عَـ - زَعَـ - مَ - زَعَمَ" },
        { word: "وَلَدَ", parts: ["وَ", "لَـ", "دَ"], translit: "wa-la-da", rule: "وَ - لَـ - وَلَـ - دَ - وَلَدَ" },

        { word: "سَلَفَ", parts: ["سَـ", "لَـ", "فَ"], translit: "sa-la-fa", rule: "سَـ - لَـ - سَلَـ - فَ - سَلَفَ" },
        { word: "كَشَفَ", parts: ["كَـ", "شَـ", "فَ"], translit: "ka-sha-fa", rule: "كَـ - شَـ - كَشَـ - فَ - كَشَفَ" },
        { word: "أَمَرَ", parts: ["أَ", "مَـ", "رَ"], translit: "a-ma-ra", rule: "Heavy (رَ)" },
        { word: "مَكَرَ", parts: ["مَـ", "كَـ", "رَ"], translit: "ma-ka-ra", rule: "Heavy (رَ)" },
        { word: "بَلَغَ", parts: ["بَـ", "لَـ", "غَ"], translit: "ba-la-gha", rule: "Heavy (غَ)" },
        { word: "غَضَبَ", parts: ["غَـ", "ضَـ", "بَ"], translit: "gha-ḍa-ba", rule: "Heavy (غَ) & (ضَ)" },
        { word: "وَرَدَ", parts: ["وَ", "رَ", "دَ"], translit: "wa-ra-da", rule: "Heavy (رَ)" },
        { word: "خَتَمَ", parts: ["خَـ", "تَـ", "مَ"], translit: "kha-ta-ma", rule: "Heavy (خَ) only" },
        { word: "ظَلَمَ", parts: ["ظَـ", "لَـ", "مَ"], translit: "ẓa-la-ma", rule: "Heavy & interdental (ظَ)" },
        { word: "عَرَضَ", parts: ["عَـ", "رَ", "ضَ"], translit: "‘a-ra-ḍa", rule: "Heavy (رَ) & (ضَ)" },
        { word: "فَرَضَ", parts: ["فَـ", "رَ", "ضَ"], translit: "fa-ra-ḍa", rule: "Heavy (رَ) & (ضَ)" },
        { word: "تَرَكَ", parts: ["تَـ", "رَ", "كَ"], translit: "ta-ra-ka", rule: "Heavy (رَ)" },
        { word: "سَرَقَ", parts: ["سَـ", "رَ", "قَ"], translit: "sa-ra-qa", rule: "Heavy (رَ) & (قَ)" },
        { word: "فَصَلَ", parts: ["فَـ", "صَـ", "لَ"], translit: "fa-ṣa-la", rule: "Heavy (صَ)" },
        { word: "مَرَجَ", parts: ["مَـ", "رَ", "جَ"], translit: "ma-ra-ja", rule: "Heavy (رَ)" },
        { word: "صَرَفَ", parts: ["صَـ", "رَ", "فَ"], translit: "ṣa-ra-fa", rule: "Heavy (صَ) & (رَ)" },
        { word: "شَرَحَ", parts: ["شَـ", "رَ", "حَ"], translit: "sha-ra-ḥa", rule: "Heavy (رَ)" },
        { word: "صَلَحَ", parts: ["صَـ", "لَـ", "حَ"], translit: "ṣa-la-ḥa", rule: "Heavy (صَ)" },
        { word: "وَقَعَ", parts: ["وَ", "قَـ", "عَ"], translit: "wa-qa-‘a", rule: "Heavy (قَ)" },
        { word: "طَبَعَ", parts: ["طَـ", "بَـ", "عَ"], translit: "ṭa-ba-‘a", rule: "Heavy (طَ)" },
        { word: "شَرَعَ", parts: ["شَـ", "رَ", "عَ"], translit: "sha-ra-‘a", rule: "Heavy (رَ)" },
        { word: "رَفَعَ", parts: ["رَ", "فَـ", "عَ"], translit: "ra-fa-‘a", rule: "Heavy (رَ)" },
        { word: "حَضَرَ", parts: ["حَـ", "ضَـ", "رَ"], translit: "ḥa-ḍa-ra", rule: "Light (حَ), Heavy (ضَ) & (رَ)" },
        { word: "نَظَرَ", parts: ["نَـ", "ظَـ", "رَ"], translit: "na-ẓa-ra", rule: "Heavy (ظَ) & (رَ)" },

    function switchMode(mode) {
      activeMode = mode;
      currentIdx = 0;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById('lessonBar').style.display = (mode === 'spelling') ? 'flex' : 'none';
      renderCurrentActivity();
    }

    function changeSpellingLesson() {
      currentLesson = document.getElementById('lessonSelect').value;
      currentIdx = 0;
      renderCurrentActivity();
    }

    function resetSpellingScore() {
      score = 0;

      currentIdx = 0;
      renderCurrentActivity();
    }

        document.getElementById('actInstr').innerText = "Tap syllables from Right to Left to build the word:";

          <div class="target-word">${item.word}</div>
          <div class="transliteration">${item.translit}</div>
          <div class="spelling-guide">Tajweed: ${item.rule}</div>
          <div class="assembly-zone" id="assemblyZone"></div>
          <div class="syllables-pool" id="poolZone"></div>
        `;

        const assemblyZone = document.getElementById('assemblyZone');
        item.parts.forEach((_, idx) => {
          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.id = 'slot-' + idx;
          assemblyZone.appendChild(slot);
        });

        const poolZone = document.getElementById('poolZone');
        const shuffled = [...item.parts].sort(() => Math.random() - 0.5);
        shuffled.forEach(part => {
          const btn = document.createElement('div');
          btn.className = 'syllable-btn';
          btn.innerText = part;
          btn.onclick = () => handleSyllableClick(btn, part, item);
          poolZone.appendChild(btn);
        });
      }
      else if (activeMode === 'listen_pick') {
        audioBtn.style.display = 'inline-block';
        const item = listenPickData[currentIdx];
        currentAudioTarget = item.target;
        document.getElementById('totalQ').innerText = listenPickData.length;
        document.getElementById('qIdx').innerText = currentIdx + 1;
        document.getElementById('actTitle').innerText = "🎧 Listen & Pick (استمع واختر الرسم الصحيح)";
        document.getElementById('actInstr').innerText = "Listen to the audio, then choose the identical Quranic word:";

        container.innerHTML = `
          <div class="target-word">🔊 ???</div>
          <div class="transliteration">Press 'Listen' if you missed it</div>
          <div class="options-grid" id="grid"></div>
        `;
        const grid = document.getElementById('grid');
        item.options.forEach(opt => {
          const b = document.createElement('button');
          b.className = 'opt-btn';
          b.innerText = opt;
          b.onclick = () => checkGenericChoice(b, opt === item.target);
          grid.appendChild(b);
        });
        setTimeout(playCurrentAudio, 300);
      }
      else if (activeMode === 'tajweed_detect') {
        audioBtn.style.display = 'inline-block';
        const item = tajweedData[currentIdx];
        currentAudioTarget = item.word;
        document.getElementById('totalQ').innerText = tajweedData.length;
        document.getElementById('qIdx').innerText = currentIdx + 1;
        document.getElementById('actTitle').innerText = "🔍 Tajweed Detective (المحقق التجويدي)";
        document.getElementById('actInstr').innerText = item.q;

        container.innerHTML = `
          <div class="target-word">${item.word}</div>
          <div class="options-grid" id="grid" style="grid-template-columns: 1fr;"></div>
        `;
        const grid = document.getElementById('grid');
        item.options.forEach((opt, idx) => {
          const b = document.createElement('button');
          b.className = 'opt-btn';
          b.style.fontSize = '1.1rem';
          b.innerText = opt;
          b.onclick = () => checkGenericChoice(b, idx === item.ans);
          grid.appendChild(b);
        });
      }
      else if (activeMode === 'vowel_speed') {
        audioBtn.style.display = 'inline-block';
        const item = vowelSpeedData[currentIdx];
        currentAudioTarget = item.letter;
        document.getElementById('totalQ').innerText = vowelSpeedData.length;
        document.getElementById('qIdx').innerText = currentIdx + 1;
        document.getElementById('actTitle').innerText = "⚡ Vowel & Harakah Speed (سرعة الحركات والتنوين)";
        document.getElementById('actInstr').innerText = item.q;

        container.innerHTML = `
          <div class="target-word">${item.letter}</div>
          <div class="options-grid" id="grid"></div>
        `;
        const grid = document.getElementById('grid');
        item.options.forEach((opt, idx) => {
          const b = document.createElement('button');
          b.className = 'opt-btn';
          b.style.fontSize = '1.05rem';
          b.innerText = opt;
          b.onclick = () => checkGenericChoice(b, idx === item.ans);
          grid.appendChild(b);
        });
      }
      else if (activeMode === 'odd_one_out') {
        audioBtn.style.display = 'none';
        const item = oddOneOutData[currentIdx];
        document.getElementById('totalQ').innerText = oddOneOutData.length;
        document.getElementById('qIdx').innerText = currentIdx + 1;
        document.getElementById('actTitle').innerText = "🎯 Odd One Out (اكتشف الكلمة المختلفة)";
        document.getElementById('actInstr').innerText = item.q;

        container.innerHTML = `
          <div class="options-grid" id="grid"></div>
          <div class="transliteration" id="explainBox" style="display:none; color:#00796b; font-size:0.95rem;"></div>
        `;
        const grid = document.getElementById('grid');
        item.options.forEach((opt, idx) => {
          const b = document.createElement('button');
          b.className = 'opt-btn';
          b.innerText = opt;
          b.onclick = () => {
            speakArabic(opt);
            checkGenericChoice(b, idx === item.ans);
            document.getElementById('explainBox').innerText = item.explain;
            document.getElementById('explainBox').style.display = 'block';
          };
          grid.appendChild(b);
        });
      }
      else if (activeMode === 'flashcards') {
        audioBtn.style.display = 'inline-block';
        const item = flashcardsData[currentIdx];
        currentAudioTarget = item.word;
        document.getElementById('totalQ').innerText = flashcardsData.length;
        document.getElementById('qIdx').innerText = currentIdx + 1;
        document.getElementById('actTitle').innerText = "🃏 Reading Flashcard (بطاقات القراءة الذاتية)";
        document.getElementById('actInstr').innerText = "Look at the word, pronounce it, then tap card to reveal pronunciation:";

        container.innerHTML = `
          <div class="flashcard" onclick="revealCard(this)">
            <div class="target-word">${item.word}</div>
            <div style="color:#888; font-size:0.88rem;">(Tap to reveal Transliteration & Tajweed)</div>
            <div class="reveal-text" id="revText">
              <div>${item.translit}</div>
              <div style="font-size:0.95rem; color:#00796b; margin-top:4px;">Rule: ${item.rule}</div>
            </div>
          </div>
        `;
        document.getElementById('nextBtn').style.display = 'inline-block';
      }
    }

    // ==========================================
    // EVENT HANDLERS
    // ==========================================
    function handleSyllableClick(btn, text, item) {
      const expected = item.parts[currentInput.length];
      speakArabic(text);

      if (text === expected) {
        const slot = document.getElementById('slot-' + currentInput.length);
        slot.innerText = text;
        slot.classList.add('filled');
        currentInput.push(text);
        btn.classList.add('disabled');

        if (currentInput.length === item.parts.length) {
          score += 10;
          document.getElementById('score').innerText = score;
          document.getElementById('nextBtn').style.display = 'inline-block';
          setTimeout(playCurrentAudio, 350);
        }
      } else {
        btn.style.borderColor = '#e91e63';
        setTimeout(() => btn.style.borderColor = '#80cbc4', 450);
      }
    }

    function checkGenericChoice(btn, isCorrect) {
      if (isCorrect) {
        btn.classList.add('correct');
        score += 10;
        document.getElementById('score').innerText = score;
        document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
        document.getElementById('nextBtn').style.display = 'inline-block';
      } else {
        btn.classList.add('wrong');
      }
    }

    function revealCard(el) {
      document.getElementById('revText').style.display = 'block';
      playCurrentAudio();
    }

    function handleNextClick() {
      let maxLen = 0;
      if (activeMode === 'spelling') maxLen = spellingData[currentLesson].length;
      else if (activeMode === 'listen_pick') maxLen = listenPickData.length;
      else if (activeMode === 'tajweed_detect') maxLen = tajweedData.length;
      else if (activeMode === 'vowel_speed') maxLen = vowelSpeedData.length;
      else if (activeMode === 'odd_one_out') maxLen = oddOneOutData.length;
      else if (activeMode === 'flashcards') maxLen = flashcardsData.length;

      if (currentIdx < maxLen - 1) {
        currentIdx++;
        renderCurrentActivity();
      } else {
        alert("🎉 Masha'Allah! You finished all items in this section successfully!");
        currentIdx = 0;
        renderCurrentActivity();
      }
    }

    function playCurrentAudio() {
      speakArabic(currentAudioTarget);
    }

    function speakArabic(txt) {
      if ('speechSynthesis' in window) {
        const clean = txt.replace(/[-ـ]/g, '');
        const utter = new SpeechSynthesisUtterance(clean);
        utter.lang = 'ar-SA';
        utter.rate = 0.8;
        window.speechSynthesis.speak(utter);
      }
    }

    window.onload = () => {
      renderCurrentActivity();
    };
  </script>
